name: check
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
  vorpruefung:
    # Nur die Vorpruefung (--check, aendert nichts) auf den unterstuetzten
    # Systemen. Ohne systemd im Container endet sie erwartet mit ✗ — geprueft
    # wird, dass sie sauber abbricht und nichts veraendert.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          useradd -m -u 1500 tester  # 1000 ist in ubuntu:24.04 schon vergeben (Benutzer ubuntu)
          out=$(SUDO_USER=tester bash install.sh --check 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "Vorprüfung"
          echo "$out" | grep -q "nichts wurde verändert"
          test ! -e /var/log/crtx2-install.log
